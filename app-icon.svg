<svg width="94" height="94" viewBox="0 0 94 94" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(10, 10)">
    
      
        <defs>
          <filter id="appleShadow_k_1_60275" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
          </filter>
          <filter id="appleGlow_k_1_60275" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" />
          </filter>
          <!-- Horizontal underside gradient -->
          <linearGradient id="appleUnderGrad_k_1_60275" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#141416"/>
            <stop offset="50%" stop-color="#26262B"/>
            <stop offset="100%" stop-color="#141416"/>
          </linearGradient>
          <!-- Vertical top keycap gradient -->
          <linearGradient id="appleMainGrad_k_1_60275" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1C1C1F"/>
            <stop offset="100%" stop-color="#0C0C0E"/>
          </linearGradient>
        </defs>

        <!-- 1. 3D Underside Shelf Base (8px radius, horizontal gradient, shadow, stroke) -->
        <rect x="2" y="8" width="70" height="63" rx="8" ry="8" fill="url(#appleUnderGrad_k_1_60275)" filter="url(#appleShadow_k_1_60275)" stroke="rgba(75, 75, 80, 0.45)" stroke-width="1" />

        <!-- 2. Main Top Keycap Surface (8px radius, vertical gradient, stroke 1.0) -->
        <rect x="2" y="2" width="70" height="63" rx="8" ry="8" fill="url(#appleMainGrad_k_1_60275)" stroke="rgba(75, 75, 80, 0.65)" stroke-width="1" />

        <!-- 3. Legends -->
        
        <text x="37" y="32" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="600">23</text>
      
      
    
  </g>
</svg>