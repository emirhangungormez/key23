<!doctype html>
<html lang="en" style="background: transparent !important; background-color: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key23 Overlay</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        background-color: transparent !important;
      }
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        background: transparent !important;
        background-color: transparent !important;
      }
      #key-pod, #key-cluster {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .keycap-wrapper {
        display: inline-flex !important;
        flex-direction: row !important;
        flex-shrink: 0 !important;
      }
    </style>
  </head>
  <body class="m-0 p-0 overflow-hidden select-none pointer-events-none" style="background: transparent !important; background-color: transparent !important;">
    <div id="app" style="background: transparent !important; background-color: transparent !important;"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
