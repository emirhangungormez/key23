<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <!-- Windows 11 Flow / Bloom Blue Wallpaper Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1836"/>
      <stop offset="40%" stop-color="#14346e"/>
      <stop offset="70%" stop-color="#2d64bc"/>
      <stop offset="100%" stop-color="#1e468a"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Wave 2 Gradient (Silk Highlight) -->
    <linearGradient id="wave2Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#bfdbfe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Wave 3 Dark Depth -->
    <linearGradient id="wave3Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2552" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1e4080" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- The Pod Chassis Shadow -->
    <filter id="chassisShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <filter id="keyGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#166534" flood-opacity="0.5"/>
    </filter>

    <!-- Keycap Green Gradients (Matching user's screenshot exactly!) -->
    <linearGradient id="greenKeyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65c700"/>
      <stop offset="50%" stop-color="#4ea600"/>
      <stop offset="100%" stop-color="#3d8200"/>
    </linearGradient>

    <linearGradient id="greenKeyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84e810"/>
      <stop offset="40%" stop-color="#6ecf00"/>
      <stop offset="100%" stop-color="#55a800"/>
    </linearGradient>

    <linearGradient id="greenDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76df08"/>
      <stop offset="50%" stop-color="#60be00"/>
      <stop offset="100%" stop-color="#499400"/>
    </linearGradient>

    <!-- Pod Bezel Border Gradient -->
    <linearGradient id="podBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Inner Well Inset Gradient -->
    <linearGradient id="wellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#181a22"/>
    </linearGradient>
  </defs>

  <!-- =================================================================== -->
  <!-- 1. WINDOWS 11 BLOOM / FLOW BLUE SILK WALLPAPER                      -->
  <!-- =================================================================== -->
  <!-- Base Sky -->
  <rect width="1000" height="600" fill="url(#skyGrad)"/>

  <!-- Flow Wave Layer 1 (Deep Blue Underside) -->
  <path d="M 0 320 C 220 260, 420 380, 680 300 C 850 250, 940 180, 1000 140 L 1000 600 L 0 600 Z" fill="url(#wave3Grad)"/>

  <!-- Flow Wave Layer 2 (Luminous Cyan / Sky Blue Ribbon) -->
  <path d="M 0 260 C 260 210, 480 340, 720 250 C 880 190, 960 110, 1000 80 L 1000 380 C 880 430, 680 460, 480 430 C 260 400, 120 480, 0 520 Z" fill="url(#wave1Grad)"/>

  <!-- Flow Wave Layer 3 (Silky White-Blue Crest Highlight) -->
  <path d="M 0 310 C 240 260, 460 370, 700 280 C 860 220, 940 150, 1000 110 L 1000 140 C 940 180, 850 250, 680 300 C 420 380, 220 260, 0 320 Z" fill="url(#wave2Grad)" opacity="0.95"/>

  <!-- Soft Ambient Glow behind the central visualizer -->
  <circle cx="500" cy="310" r="160" fill="#60a5fa" opacity="0.22" filter="blur(50px)"/>

  <!-- =================================================================== -->
  <!-- 2. THE KEY23 POD CHASSIS / CONTAINER (THE KEY BACKGROUND!)          -->
  <!-- =================================================================== -->
  <g transform="translate(385, 195)">
    
    <!-- Outer Chassis / Pod Body (Dark Graphite Rounded Bezel) -->
    <rect x="0" y="0" width="230" height="230" rx="46" ry="46"
          fill="url(#wellGrad)"
          stroke="url(#podBorder)"
          stroke-width="2"
          filter="url(#chassisShadow)"/>

    <!-- Inner Well Recess (Subtle 3D Plate Well) -->
    <rect x="14" y="14" width="202" height="202" rx="36" ry="36"
          fill="#13151b"
          stroke="#0b0d11"
          stroke-width="1.5"/>

    <!-- =================================================================== -->
    <!-- 3. THE 3D MECHANICAL KEYCAP (CENTRAL ICONIC KEY!)                   -->
    <!-- =================================================================== -->
    <g transform="translate(33, 31)" filter="url(#keyGlowEffect)">
      
      <!-- Keycap Base / Bottom Plate (Dark Olive Green) -->
      <rect x="0" y="0" width="164" height="166" rx="28" ry="28" fill="#2c5c00"/>

      <!-- Keycap 3D Body Skirt (Vivid Green Bevel Gradient) -->
      <rect x="4" y="3" width="156" height="154" rx="25" ry="25" fill="url(#greenKeyBase)"/>

      <!-- Stepped Under-Dish Transition -->
      <rect x="12" y="8" width="140" height="136" rx="20" ry="20" fill="#4ea600"/>

      <!-- 3D Scooped Dish Surface (Top Face with Light Reflections) -->
      <rect x="17" y="11" width="130" height="126" rx="16" ry="16"
            fill="url(#greenDish)"
            stroke="#a3f736"
            stroke-opacity="0.45"
            stroke-width="1.5"/>

      <!-- Top Face Highlight Sheen -->
      <path d="M 28 20 C 40 16, 124 16, 136 20 C 142 22, 142 28, 136 30 C 110 33, 54 33, 28 30 C 22 28, 22 22, 28 20 Z"
            fill="#ffffff"
            opacity="0.25"/>

      <!-- Centered Icon: Crisp Minimalist Mouse Glyph -->
      <g transform="translate(64, 46)">
        <!-- Mouse Outer Pill Contour -->
        <rect x="0" y="0" width="36" height="56" rx="18" ry="18"
              fill="none"
              stroke="#ffffff"
              stroke-width="3.5"
              stroke-linecap="round"/>

        <!-- Mouse Top Button Split Line -->
        <line x1="18" y1="0" x2="18" y2="24"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"/>

        <!-- Middle Scroll Wheel Dot / Pip -->
        <circle cx="18" cy="15" r="2.5" fill="#ffffff"/>
      </g>

    </g>

  </g>

  <!-- =================================================================== -->
  <!-- 4. MODERN SUBTLE WATERMARK / BRANDING                                -->
  <!-- =================================================================== -->
  <text x="500" y="520" fill="rgba(255, 255, 255, 0.55)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="3">
    KEY23 • KEYBOARD &amp; MOUSE VISUALIZER
  </text>
</svg>
