<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <!-- Windows 11 Flow Wallpaper Gradients -->
    <linearGradient id="mSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1836"/>
      <stop offset="45%" stop-color="#14346e"/>
      <stop offset="75%" stop-color="#2d64bc"/>
      <stop offset="100%" stop-color="#1e468a"/>
    </linearGradient>

    <linearGradient id="mWave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="mWave2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#bfdbfe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="mWave3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2552" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1e4080" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="mChassisShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <filter id="mKeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Keycap Gradients: Red/Amber PBT -->
    <linearGradient id="mRedTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B63"/>
      <stop offset="100%" stop-color="#E0302C"/>
    </linearGradient>
    <linearGradient id="mRedDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52"/>
      <stop offset="100%" stop-color="#D92824"/>
    </linearGradient>

    <!-- Keycap Gradients: Gold/Amber PBT -->
    <linearGradient id="mGoldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="mGoldDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC226"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Wallpaper Background -->
  <rect width="1000" height="500" fill="url(#mSkyGrad)"/>
  <path d="M 0 280 C 220 220, 420 340, 680 260 C 850 210, 940 140, 1000 100 L 1000 500 L 0 500 Z" fill="url(#mWave3)"/>
  <path d="M 0 220 C 260 170, 480 300, 720 210 C 880 150, 960 70, 1000 40 L 1000 340 C 880 390, 680 420, 480 390 C 260 360, 120 440, 0 480 Z" fill="url(#mWave1)"/>
  <path d="M 0 270 C 240 220, 460 330, 700 240 C 860 180, 940 110, 1000 70 L 1000 100 C 940 140, 850 210, 680 260 C 420 340, 220 220, 0 280 Z" fill="url(#mWave2)" opacity="0.95"/>

  <circle cx="500" cy="250" r="220" fill="#60a5fa" opacity="0.18" filter="blur(60px)"/>

  <!-- =================================================================== -->
  <!-- POD CHASSIS CONTAINER WITH MULTIPLE KEYS                            -->
  <!-- =================================================================== -->
  <g transform="translate(195, 170)">
    
    <!-- Dark Capsule Pod Background (The Key Background!) -->
    <rect x="-16" y="-14" width="642" height="152" rx="36" ry="36"
          fill="rgba(20, 23, 31, 0.94)"
          stroke="rgba(255, 255, 255, 0.16)"
          stroke-width="1.8"
          filter="url(#mChassisShadow)"/>

    <!-- Keycap 1: CTRL -->
    <g transform="translate(14, 8)" filter="url(#mKeyGlow)">
      <rect x="0" y="0" width="134" height="110" rx="15" fill="#8A1C18"/>
      <rect x="3" y="3" width="128" height="102" rx="13" fill="url(#mRedTop)"/>
      <rect x="9" y="6" width="116" height="90" rx="9" fill="#B3241F"/>
      <rect x="13" y="8" width="108" height="84" rx="7" fill="url(#mRedDish)" stroke="#FF857E" stroke-opacity="0.3" stroke-width="1"/>
      <text x="67" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1">CTRL</text>
    </g>

    <!-- Keycap 2: SHIFT -->
    <g transform="translate(166, 8)" filter="url(#mKeyGlow)">
      <rect x="0" y="0" width="148" height="110" rx="15" fill="#8A1C18"/>
      <rect x="3" y="3" width="142" height="102" rx="13" fill="url(#mRedTop)"/>
      <rect x="9" y="6" width="130" height="90" rx="9" fill="#B3241F"/>
      <rect x="13" y="8" width="122" height="84" rx="7" fill="url(#mRedDish)" stroke="#FF857E" stroke-opacity="0.3" stroke-width="1"/>
      <text x="74" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1">SHIFT</text>
    </g>

    <!-- Keycap 3: K -->
    <g transform="translate(332, 8)" filter="url(#mKeyGlow)">
      <rect x="0" y="0" width="112" height="110" rx="15" fill="#995200"/>
      <rect x="3" y="3" width="106" height="102" rx="13" fill="url(#mGoldTop)"/>
      <rect x="9" y="6" width="94" height="90" rx="9" fill="#B36200"/>
      <rect x="13" y="8" width="86" height="84" rx="7" fill="url(#mGoldDish)" stroke="#FFE082" stroke-opacity="0.4" stroke-width="1"/>
      <text x="56" y="60" fill="#18181b" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle">K</text>
    </g>

    <!-- Combination Result: [ = ] [ PALETTE ] -->
    <g transform="translate(460, 48)">
      <text x="14" y="24" fill="rgba(255,255,255,0.45)" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">=</text>
      <rect x="38" y="-14" width="134" height="66" rx="14" fill="#1e2434" stroke="#3b82f6" stroke-width="1.6"/>
      <text x="105" y="27" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">COMMAND</text>
    </g>

  </g>

</svg>
