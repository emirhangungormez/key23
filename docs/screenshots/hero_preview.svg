<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#10141e"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <!-- Glass Pod Filter & Shadow -->
    <filter id="podShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="keyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Keycap Gradients: Mod (Amber/Red) -->
    <linearGradient id="pbtModTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B63"/>
      <stop offset="100%" stop-color="#E0302C"/>
    </linearGradient>
    <linearGradient id="pbtModDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52"/>
      <stop offset="100%" stop-color="#D92824"/>
    </linearGradient>

    <!-- Keycap Gradients: Alpha (Gold/Yellow) -->
    <linearGradient id="pbtAlphaTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pbtAlphaDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC226"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="65" x2="1000" y2="65"/>
    <line x1="0" y1="130" x2="1000" y2="130"/>
    <line x1="0" y1="195" x2="1000" y2="195"/>
    <line x1="0" y1="260" x2="1000" y2="260"/>
    <line x1="0" y1="325" x2="1000" y2="325"/>
    <line x1="0" y1="390" x2="1000" y2="390"/>
    <line x1="0" y1="455" x2="1000" y2="455"/>
    <line x1="125" y1="0" x2="125" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="375" y1="0" x2="375" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="625" y1="0" x2="625" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
    <line x1="875" y1="0" x2="875" y2="520"/>
  </g>

  <!-- Ambient Glow Behind Visualizer -->
  <circle cx="500" cy="240" r="260" fill="#2563eb" opacity="0.12" filter="blur(60px)"/>
  <circle cx="360" cy="230" r="180" fill="#ff4740" opacity="0.1" filter="blur(50px)"/>

  <!-- =================================================================== -->
  <!-- FLOATING KEYBOARD HUD (WITH POD CHASSIS / CAPSULE BACKGROUND)       -->
  <!-- =================================================================== -->
  <g transform="translate(180, 160)">
    
    <!-- 1. The Pod Chassis / Capsule Container (New Toggle Feature!) -->
    <rect x="-18" y="-14" width="676" height="136" rx="28" ry="28"
          fill="rgba(18, 20, 28, 0.88)"
          stroke="rgba(255, 255, 255, 0.14)"
          stroke-width="1.5"
          filter="url(#podShadow)"/>

    <!-- Inner Border Glow -->
    <rect x="-17" y="-13" width="674" height="134" rx="27" ry="27"
          fill="none"
          stroke="rgba(255, 255, 255, 0.04)"
          stroke-width="1"/>

    <!-- Keycap 1: CTRL (Modifier - Red/Amber PBT) -->
    <g transform="translate(10, 0)" filter="url(#keyGlow)">
      <!-- Base Plate -->
      <rect x="0" y="0" width="130" height="108" rx="14" fill="#8A1C18"/>
      <!-- Body Skirt -->
      <rect x="2" y="2" width="126" height="100" rx="12" fill="url(#pbtModTop)"/>
      <!-- Stepped Under-Dish -->
      <rect x="7" y="5" width="116" height="88" rx="9" fill="#B3241F"/>
      <!-- 3D Scooped Dish -->
      <rect x="11" y="7" width="108" height="82" rx="7" fill="url(#pbtModDish)" stroke="#FF857E" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Legend Text -->
      <text x="65" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">CTRL</text>
    </g>

    <!-- Keycap 2: SHIFT (Modifier - Red/Amber PBT) -->
    <g transform="translate(156, 0)" filter="url(#keyGlow)">
      <!-- Base Plate -->
      <rect x="0" y="0" width="145" height="108" rx="14" fill="#8A1C18"/>
      <!-- Body Skirt -->
      <rect x="2" y="2" width="141" height="100" rx="12" fill="url(#pbtModTop)"/>
      <!-- Stepped Under-Dish -->
      <rect x="7" y="5" width="131" height="88" rx="9" fill="#B3241F"/>
      <!-- 3D Scooped Dish -->
      <rect x="11" y="7" width="123" height="82" rx="7" fill="url(#pbtModDish)" stroke="#FF857E" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Legend Text -->
      <text x="72" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">SHIFT</text>
    </g>

    <!-- Keycap 3: P (Alpha - Gold/Amber PBT) -->
    <g transform="translate(317, 0)" filter="url(#keyGlow)">
      <!-- Base Plate -->
      <rect x="0" y="0" width="106" height="108" rx="14" fill="#995200"/>
      <!-- Body Skirt -->
      <rect x="2" y="2" width="102" height="100" rx="12" fill="url(#pbtAlphaTop)"/>
      <!-- Stepped Under-Dish -->
      <rect x="7" y="5" width="92" height="88" rx="9" fill="#B36200"/>
      <!-- 3D Scooped Dish -->
      <rect x="11" y="7" width="84" height="82" rx="7" fill="url(#pbtAlphaDish)" stroke="#FFE082" stroke-opacity="0.4" stroke-width="1"/>
      <!-- Legend Text -->
      <text x="53" y="58" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" text-anchor="middle">P</text>
    </g>

    <!-- Combination Result Badge (= Command Palette) -->
    <g transform="translate(442, 38)">
      <text x="14" y="24" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">=</text>
      
      <!-- Result Keycap Capsule -->
      <g transform="translate(36, -20)">
        <rect x="0" y="0" width="148" height="70" rx="14" fill="#1e2230" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="74" y="42" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PALETTE</text>
      </g>
    </g>

  </g>

  <!-- =================================================================== -->
  <!-- MOUSE CURSOR INDICATOR WITH CLICK HIGHLIGHT                         -->
  <!-- =================================================================== -->
  <g transform="translate(860, 270)">
    <!-- Mouse Body -->
    <rect x="0" y="0" width="38" height="52" rx="19" fill="#141822" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#podShadow)"/>
    <!-- Left Button (Highlighted / Active Click) -->
    <path d="M 3 19 A 16 16 0 0 1 18 3 L 18 24 L 3 24 Z" fill="#3b82f6"/>
    <!-- Right Button (Inactive) -->
    <path d="M 20 3 A 16 16 0 0 1 35 19 L 20 19 Z" fill="none" stroke="rgba(255,255,255,0.1)"/>
    <!-- Scroll Wheel Slot -->
    <rect x="17" y="8" width="4" height="12" rx="2" fill="#60a5fa"/>
    <!-- Click Wave Pulse -->
    <circle cx="10" cy="12" r="16" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- =================================================================== -->
  <!-- HEADER & SUBTITLE BRANDING                                          -->
  <!-- =================================================================== -->
  <text x="500" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Key23
  </text>
  <text x="500" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Modern, Low-Latency Keystroke &amp; Mouse Visualizer for Windows (Rust + Tauri v2)
  </text>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(170, 430)">
    <!-- Badge 1: 5 3D Keycap Styles -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="95" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⌨️ 5 Keycap 3D Styles</text>

    <!-- Badge 2: Capsule Pod Toggle (New!) -->
    <rect x="206" y="0" width="220" height="34" rx="17" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)"/>
    <text x="316" y="21" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✨ Tuş Arka Planı (Pod Toggle)</text>

    <!-- Badge 3: 0 Latency Win32 Hooks -->
    <rect x="442" y="0" width="216" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="550" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Zero-Latency Rust Hooks</text>
  </g>

</svg>
