<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="bgStyle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <!-- PBT Gradients -->
    <linearGradient id="sPbtTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B63"/>
      <stop offset="100%" stop-color="#E0302C"/>
    </linearGradient>

    <!-- Retro Gradients -->
    <linearGradient id="sRetroTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6E0D2"/>
      <stop offset="100%" stop-color="#CCC2B0"/>
    </linearGradient>

    <!-- M0116 Gradients -->
    <linearGradient id="sM0116Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD8CB"/>
      <stop offset="100%" stop-color="#C0B9A8"/>
    </linearGradient>

    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="16" fill="url(#bgStyle)"/>

  <!-- Title -->
  <text x="480" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    Key23 — 5 Farklı Orijinal Tuş Tasarım Stili
  </text>
  <text x="480" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
    Matematiksel 3D vektör grafikleri ve ışıklandırma simülasyonu ile piksel hassasiyetinde çizilir.
  </text>

  <!-- =================================================================== -->
  <!-- 1. PBT MECHANICAL                                                  -->
  <!-- =================================================================== -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#151923" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="28" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. PBT Mechanical</text>
    
    <g transform="translate(38, 48)" filter="url(#shadowS)">
      <rect x="0" y="0" width="84" height="78" rx="11" fill="#8A1C18"/>
      <rect x="2" y="2" width="80" height="72" rx="9" fill="url(#sPbtTop)"/>
      <rect x="6" y="5" width="72" height="62" rx="6" fill="#D92824" stroke="#FF857E" stroke-opacity="0.3"/>
      <text x="42" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">K</text>
    </g>
    <text x="80" y="156" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Kavisli 3D Çanak</text>
  </g>

  <!-- =================================================================== -->
  <!-- 2. APPLE MODERN                                                    -->
  <!-- =================================================================== -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#151923" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Apple Modern</text>
    
    <g transform="translate(42, 50)" filter="url(#shadowS)">
      <rect x="0" y="4" width="76" height="70" rx="9" fill="#000000" opacity="0.4"/>
      <rect x="0" y="0" width="76" height="70" rx="9" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <rect x="2" y="2" width="72" height="66" rx="8" fill="#27272a"/>
      <text x="38" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">K</text>
    </g>
    <text x="80" y="156" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Koyu Şık Profil</text>
  </g>

  <!-- =================================================================== -->
  <!-- 3. RETRO BEIGE                                                     -->
  <!-- =================================================================== -->
  <g transform="translate(400, 90)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#151923" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Retro Beige</text>
    
    <g transform="translate(38, 48)" filter="url(#shadowS)">
      <rect x="0" y="0" width="84" height="78" rx="10" fill="#999182"/>
      <rect x="2" y="2" width="80" height="72" rx="8" fill="url(#sRetroTop)"/>
      <rect x="7" y="5" width="70" height="62" rx="6" fill="#E3DDD0" stroke="#FFF" stroke-opacity="0.5"/>
      <text x="42" y="42" fill="#423e37" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle">K</text>
    </g>
    <text x="80" y="156" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">90'lar Klasik Mekanik</text>
  </g>

  <!-- =================================================================== -->
  <!-- 4. MINIMAL PILL                                                    -->
  <!-- =================================================================== -->
  <g transform="translate(580, 90)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#151923" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="28" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Minimal Pill</text>
    
    <g transform="translate(48, 54)" filter="url(#shadowS)">
      <rect x="0" y="0" width="64" height="64" rx="32" fill="#18181b" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <text x="32" y="39" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" text-anchor="middle">K</text>
    </g>
    <text x="80" y="156" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Yuvarlak Kapsül</text>
  </g>

  <!-- =================================================================== -->
  <!-- 5. M0116 VINTAGE                                                   -->
  <!-- =================================================================== -->
  <g transform="translate(760, 90)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#151923" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5. M0116 Vintage</text>
    
    <g transform="translate(40, 48)" filter="url(#shadowS)">
      <rect x="0" y="0" width="80" height="78" rx="9" fill="#756E62"/>
      <rect x="2" y="2" width="76" height="72" rx="7" fill="url(#sM0116Top)"/>
      <rect x="6" y="4" width="68" height="60" rx="5" fill="#E8E3D8"/>
      <text x="22" y="52" fill="#3b372e" font-family="-apple-system, sans-serif" font-style="italic" font-size="17" font-weight="700" text-anchor="start">K</text>
    </g>
    <text x="80" y="156" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">1987 Eğik İtalik Font</text>
  </g>

</svg>
